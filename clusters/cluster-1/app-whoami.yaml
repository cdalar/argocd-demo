apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: whoami
  namespace: argocd
spec:
  destination:
    namespace: apps
    server: https://kubernetes.default.svc
  project: default
  source:
    directory:
      jsonnet: {}
      recurse: true
    path: clusters/cluster-1/apps
    repoURL: https://github.com/cdalar/argocd-demo.git
    targetRevision: dev
  syncPolicy:
    automated: {}
    # syncOptions:
    #   - CreateNamespace=true
    #   - Prune=true
    #   - Validate=true