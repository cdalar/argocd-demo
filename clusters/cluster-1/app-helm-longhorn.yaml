apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  ignoreDifferences:
  - kind: Service
    jsonPointers:
    - /spec/ports/0/nodePort
  project: default
  destination:
    namespace: longhorn-system
    server: https://kubernetes.default.svc
  sources:
  - repoURL: 'https://charts.longhorn.io'
    chart: longhorn
    targetRevision: 1.7.2
    helm:
      valueFiles:
      - $values/clusters/cluster-1/longhorn/values-custom.yaml
  - repoURL: 'https://github.com/cdalar/argocd-demo.git'
    targetRevision: dev
    ref: values
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
    #   - Prune=true
    #   - Validate=true