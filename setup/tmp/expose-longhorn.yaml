# apiVersion: traefik.containo.us/v1alpha1
# kind: Middleware
# metadata:
#   name: stripprefix
#   namespace: longhorn-system
# spec:
#   stripPrefix:
#     prefixes:
#       - /lh
# ---
# apiVersion: networking.k8s.io/v1
# kind: Ingress
# metadata:
#   name: longhorn-ingress
#   namespace: longhorn-system
#   annotations:
#     traefik.ingress.kubernetes.io/router.middlewares: stripprefix
# spec:
#   rules:
#   - http:
#       paths:
#       - path: /lh
#         pathType: Prefix
#         backend:
#           service:
#             name: longhorn-frontend
#             port:
#               number: 80
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: longhorn-rewrite
  namespace: longhorn-system
spec:
  stripPrefix:
    prefixes:
      - /long
---
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: longhorn-ingressroute
  namespace: longhorn-system
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/long`)
      kind: Rule
      services:
        - name: longhorn-frontend
          port: 80
      middlewares:
        - name: longhorn-rewrite
  # Optional: If you use TLS
  tls: {}
